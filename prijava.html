<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prijava | Božjakovina Marketing</title>
    <link rel="stylesheet" href="style12.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        .auth-section { min-height: 80vh; display: flex; align-items: center; justify-content: center; padding-top: 150px; }
        .auth-container { width: 100%; max-width: 450px; background: var(--svijetlo-siva, #f4f4f4); padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        #register-form { display: none; }
        .auth-toggle-text { text-align: center; margin-top: 20px; cursor: pointer; color: var(--plava, #007bff); font-weight: 700; }
        .forma-input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; }
    </style>
</head>
<body class="pocetna-stranica">

    <header class="header">
        <div class="header-container">
            <a href="index.html" class="logo-wrapper">
                <img src="logo.png" alt="Logo" class="logo">
                <div class="logo-text">Božjakovina <span>Marketing</span></div>
            </a>
            <nav class="nav">
                <ul class="nav-list">
                    <li><a href="index.html" class="nav-link">Početna</a></li>
                    <li><a href="Onama.html" class="nav-link">O nama</a></li>
                    <li><a href="kontakt.html" class="nav-link">Kontakt</a></li>
                    <li><a href="projekti.html" class="nav-link">Projekti</a></li>
                </ul>
            </nav>
            <div class="header-actions" id="auth-status">
                <a href="prijava.html" class="btn-prijava">Prijava</a>
            </div>
        </div>
    </header>

    <main class="auth-section">
        <div class="auth-container">
            
            <div id="login-form">
                <h2 style="text-align:center;">Prijava</h2>
                <form class="kontakt-forma">
                    <input type="email" class="forma-input" placeholder="Email adresa" required>
                    <input type="password" class="forma-input" placeholder="Lozinka" required>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Prijavi se</button>
                </form>
                <p class="auth-toggle-text" onclick="toggleAuth()">Nemaš račun? Registriraj se</p>
            </div>

            <div id="register-form">
                <h2 style="text-align:center;">Registracija</h2>
                <form class="kontakt-forma">
                    <input type="text" class="forma-input" placeholder="Ime i prezime" required>
                    <input type="email" class="forma-input" placeholder="Email adresa" required>
                    <input type="password" class="forma-input" placeholder="Smislite lozinku" required>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Kreiraj račun</button>
                </form>
                <p class="auth-toggle-text" onclick="toggleAuth()">Već imaš račun? Prijavi se</p>
            </div>

        </div>
    </main>

    <script>
        // --- POSTAVKE ---
        const SHEETDB_URL = "https://sheetdb.io/api/v1/ju7fsajt596m3"; 

        function toggleAuth() {
            const login = document.getElementById('login-form');
            const register = document.getElementById('register-form');
            login.style.display = (login.style.display === 'none') ? 'block' : 'none';
            register.style.display = (register.style.display === 'none') ? 'block' : 'none';
        }

        // --- REGISTRACIJA ---
        const regForm = document.querySelector('#register-form form');
        regForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const ime = regForm.querySelector('input[type="text"]').value;
            const email = regForm.querySelector('input[type="email"]').value;
            const lozinka = regForm.querySelector('input[type="password"]').value;

            fetch(SHEETDB_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ data: [{ ime, email, lozinka }] })
            })
            .then(res => res.json())
            .then(() => {
                alert("Registracija uspješna!");
                toggleAuth();
                regForm.reset();
            })
            .catch(err => alert("Greška: " + err));
        });

        // --- PRIJAVA ---
        const logForm = document.querySelector('#login-form form');
        logForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const emailIn = logForm.querySelector('input[type="email"]').value;
            const lozinkaIn = logForm.querySelector('input[type="password"]').value;

            fetch(`${SHEETDB_URL}/search?email=${emailIn}`)
            .then(res => res.json())
            .then(data => {
                if (data.length > 0 && data[0].lozinka === lozinkaIn) {
                    localStorage.setItem('korisnikIme', data[0].ime);
                    window.location.href = "index.html";
                } else {
                    alert("Krivi podaci!");
                }
            });
        });

        // --- STATUS U HEADERU ---
        const spremljenoIme = localStorage.getItem('korisnikIme');
        if (spremljenoIme) {
            document.getElementById('auth-status').innerHTML = 
                `<span>Bok, ${spremljenoIme}</span> | <a href="#" onclick="logout()" style="color:red;">Odjava</a>`;
        }

        function logout() {
            localStorage.removeItem('korisnikIme');
            location.reload();
        }
    </script>
</body>
</html>
