<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prijava | Božjakovina Marketing</title>
    <link rel="stylesheet" href="style12.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800;900&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        .auth-section {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: 180px; 
            padding-bottom: 80px;
        }
        .auth-container {
            width: 100%;
            max-width: 450px;
            background: var(--svijetlo-siva);
            padding: 40px;
            border-radius: var(--border-radius-lg);
            border: 1px solid var(--siva-1);
            box-shadow: var(--shadow);
        }
        .auth-toggle-text {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9rem;
            color: var(--siva-4);
        }
        .auth-toggle-text a {
            color: var(--plava);
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
        }
        .auth-toggle-text a:hover {
            text-decoration: underline;
        }
        #register-form {
            display: none;
        }
        .footer-bottom{
            background-colour: black;
        }
    </style>
</head>
<body class="pocetna-stranica"> 
    <header class="header">
        <div class="header-container">
            <a href="index.html" class="logo-wrapper">
                <img src="logo.png" alt="Božjakovina Marketing Logo" class="logo">
            </a>

            <nav class="nav">
                <ul class="nav-list">
                    <li><a href="index.html" class="nav-link">Početna</a></li>
                    <li><a href="Onama.html" class="nav-link">O nama</a></li>
                    <li><a href="kontakt.html" class="nav-link">Kontakt</a></li>
                    <li><a href="projekti.html" class="nav-link">Projekti</a></li>
                </ul>
            </nav>
            <div class="header-actions" id="auth-status">
                <a href="prijava.html" class="btn-prijava">Prijava</a>
            </div>
            <button class="mobile-menu-toggle" aria-label="Otvori izbornik">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>
        </div>
    </header>

    <main class="auth-section section-container">
        <div class="auth-container">
            
            <div id="login-form">
                <h2 class="section-title" style="font-size: 2rem;">Prijava</h2>
                <p style="text-align: center; margin-bottom: 30px; color: var(--siva-4);">Dobrodošli natrag!</p>
                
                <form class="kontakt-forma">
                    <div class="forma-group">
                        <input type="email" class="forma-input" placeholder="Email adresa" required>
                    </div>
                    <div class="forma-group">
                        <input type="password" class="forma-input" placeholder="Lozinka" required>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Prijavi se</button>
                </form>
                
                <p class="auth-toggle-text">
                    Nemaš račun? <a onclick="toggleAuth()">Registriraj se</a>
                </p>
            </div>

            <div id="register-form">
                <h2 class="section-title" style="font-size: 2rem;">Registracija</h2>
                <p style="text-align: center; margin-bottom: 30px; color: var(--siva-4);">Postani dio naše zajednice.</p>
                
                <form class="kontakt-forma">
                    <div class="forma-group">
                        <input type="text" class="forma-input" placeholder="Ime i prezime" required>
                    </div>
                    <div class="forma-group">
                        <input type="email" class="forma-input" placeholder="Email adresa" required>
                    </div>
                    <div class="forma-group">
                        <input type="password" class="forma-input" placeholder="Smislite lozinku" required>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Kreiraj račun</button>
                </form>
                
                <p class="auth-toggle-text">
                    Već imaš račun? <a onclick="toggleAuth()">Prijavi se</a>
                </p>
            </div>

        </div>
    </main>

    <footer class="footer">
        <div class="footer-container">
            <div class="footer-bottom">
                <p class="footer-copyright" style="text-align: center; width: 100%;">
                    © 2026 <span class="highlight">Božjakovina Marketing</span>. Sva prava pridržana.
                </p>
            </div>
        </div>
    </footer>

    <script>
        // TVOJ SHEETDB URL
        const SHEETDB_URL = "https://sheetdb.io/api/v1/ju7fsajt596m3";

        // Prebacivanje između Prijava i Registracija
        function toggleAuth() {
            const login = document.getElementById('login-form');
            const register = document.getElementById('register-form');
            if (login.style.display === 'none') {
                login.style.display = 'block';
                register.style.display = 'none';
            } else {
                login.style.display = 'none';
                register.style.display = 'block';
            }
        }

        // --- REGISTRACIJA ---
        const regForm = document.querySelector('#register-form form');
        regForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const ime = regForm.querySelector('input[type="text"]').value;
            const email = regForm.querySelector('input[type="email"]').value;
            const lozinka = regForm.querySelector('input[type="password"]').value;

            fetch(SHEETDB_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ data: [{ ime, email, lozinka }] })
            })
            .then(res => res.json())
            .then(data => {
                alert("Registracija uspješna! Sad se prijavi.");
                toggleAuth();
                regForm.reset();
            })
            .catch(err => alert("Greška: " + err));
        });

        // --- PRIJAVA ---
        const logForm = document.querySelector('#login-form form');
        logForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const emailIn = logForm.querySelector('input[type="email"]').value;
            const lozinkaIn = logForm.querySelector('input[type="password"]').value;

            fetch(SHEETDB_URL + "/search?email=" + emailIn)
            .then(res => res.json())
            .then(data => {
                if (data.length > 0 && data[0].lozinka === lozinkaIn) {
                    localStorage.setItem('korisnikIme', data[0].ime);
                    window.location.href = "index.html";
                } else {
                    alert("Krivi podaci za prijavu.");
                }
            });
        });

        // --- PROVJERA PRIJAVE ZA HEADER ---
        window.onload = function() {
            const spremljenoIme = localStorage.getItem('korisnikIme');
            const authStatus = document.getElementById('auth-status');
            if (spremljenoIme && authStatus) {
                authStatus.innerHTML = `<span style="margin-right:10px; font-weight:700;">Bok, ${spremljenoIme}</span> <a href="#" onclick="odjava()" style="color:red; font-size:0.8rem;">Odjava</a>`;
            }
        };

        function odjava() {
            localStorage.removeItem('korisnikIme');
            location.reload();
        }

        // Mobilni menu
        const menuToggle = document.querySelector('.mobile-menu-toggle');
        const navList = document.querySelector('.nav-list');
        menuToggle.addEventListener('click', () => {
            menuToggle.classList.toggle('active');
            navList.classList.toggle('active');
        });
    </script>
</body>
</html>
